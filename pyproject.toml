[project]
name = "tgbot"
version = "0.1.0"
description = ""
authors = [
    {name = "vladislav-png",email = "vladislav0fficiallll@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14, <3.15"
dependencies = [
    "aiogram (>=3.31.0,<4.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "asyncio (>=4.0.0,<5.0.0)",
    "aiohttp (>=3.14.4,<4.0.0)",
    "sqlalchemy (>=2.1.4,<3.0.0)",
    "logging (>=0.4.9.6,<0.5.0.0)"
]

[tool.poetry]
packages = [{include = "tgbot", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
